name: Package Windows executable
on:
  push:
    branches: [main]
    paths:
      - '*.py'
      - exporter/**
      - pyproject.toml
      - icon.ico
      - scripts/build_windows.ps1
      - scripts/collect_release_notices.py
      - packaging/**
      - .github/workflows/windows-package.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          architecture: x64
      - run: python -m pip install '.[dev]' 'pyinstaller==6.22.3'
      - run: python -m pytest -q
      - name: Build and smoke-test the actual Windows executable
        shell: pwsh
        run: ./scripts/build_windows.ps1
      - name: Inventory bundled files and collect exact installed notices
        run: python scripts/collect_release_notices.py
      - uses: actions/upload-artifact@v4
        with:
          name: SpotifyExporter-ThirdPartyNotices
          path: dist/SpotifyExporter-ThirdPartyNotices.zip
          if-no-files-found: error
          retention-days: 30
      - name: Prepare bounded transfer parts and source manifest
        id: split
        shell: python
        run: |
          import hashlib
          import json
          import os
          import shutil
          from pathlib import Path

          source = Path("dist/SpotifyExporter.exe")
          part_size = 20 * 1024 * 1024
          if source.stat().st_size > part_size * 4:
              raise RuntimeError("Executable exceeds the four-part transfer budget")
          parts = []
          with source.open("rb") as stream:
              while chunk := stream.read(part_size):
                  number = len(parts) + 1
                  folder = Path(f"dist/transfer/part{number:02d}")
                  folder.mkdir(parents=True, exist_ok=True)
                  filename = f"SpotifyExporter.exe.part{number:02d}"
                  (folder / filename).write_bytes(chunk)
                  parts.append({"filename": filename, "size": len(chunk),
                                "sha256": hashlib.sha256(chunk).hexdigest()})
          digest = hashlib.sha256(source.read_bytes()).hexdigest()
          expected = Path("dist/SHA256SUMS.txt").read_text().split()[0]
          if digest != expected:
              raise RuntimeError("Executable changed after its smoke test")
          manifest = {"filename": source.name, "size": source.stat().st_size,
                      "sha256": digest, "source_sha": os.environ["GITHUB_SHA"],
                      "run_id": os.environ["GITHUB_RUN_ID"],
                      "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
                      "architecture": "Windows x64", "parts": parts}
          Path("dist/transfer-manifest.json").write_text(json.dumps(manifest, indent=2), encoding="utf-8")
          for number in range(1, len(parts) + 1):
              folder = Path(f"dist/transfer/part{number:02d}")
              for filename in ("transfer-manifest.json", "SHA256SUMS.txt",
                               "smoke-report.json", "build-dependencies.txt"):
                  shutil.copyfile(Path("dist") / filename, folder / filename)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"part_count={len(parts)}\n")
          print(json.dumps(manifest, indent=2))
      - uses: actions/upload-artifact@v4
        with:
          name: SpotifyExporter-windows-x64
          path: |
            dist/SpotifyExporter.exe
            dist/SHA256SUMS.txt
            dist/smoke-report.json
            dist/build-dependencies.txt
            dist/transfer-manifest.json
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: ${{ fromJSON(steps.split.outputs.part_count) >= 1 }}
        with:
          name: SpotifyExporter-windows-x64-part-01
          path: dist/transfer/part01/*
          compression-level: 0
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: ${{ fromJSON(steps.split.outputs.part_count) >= 2 }}
        with:
          name: SpotifyExporter-windows-x64-part-02
          path: dist/transfer/part02/*
          compression-level: 0
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: ${{ fromJSON(steps.split.outputs.part_count) >= 3 }}
        with:
          name: SpotifyExporter-windows-x64-part-03
          path: dist/transfer/part03/*
          compression-level: 0
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: ${{ fromJSON(steps.split.outputs.part_count) >= 4 }}
        with:
          name: SpotifyExporter-windows-x64-part-04
          path: dist/transfer/part04/*
          compression-level: 0
          if-no-files-found: error
          retention-days: 30
