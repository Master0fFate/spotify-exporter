[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "spotify-playlist-exporter-desktop"
version = "3.0.0"
description = "A desktop exporter for Spotify playlist metadata"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
  "PyQt6>=6.8,<7",
  "PyQt6-Fluent-Widgets>=1.8,<2",
  "spotipy>=2.26,<3",
  "requests>=2.32.4,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.12,<1", "build>=1,<2"]

[project.gui-scripts]
spotify-exporter = "spotify_exporter:main"

[tool.setuptools]
py-modules = ["spotify_exporter"]

[tool.setuptools.packages.find]
include = ["exporter*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
